<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CollabConnect - Discover & Collaborate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Discover & Collaborate</h2>

  <div class="filters">
    <input id="search" placeholder="Search by name or niche" oninput="render()">
    <select id="role" onchange="render()">
      <option value="">All roles</option>
      <option value="creator">Creator</option>
      <option value="brand">Brand</option>
      <option value="business">Business</option>
    </select>
    <label><input type="checkbox" id="verifiedOnly" onchange="render()"> Verified only</label>
  </div>

  <div id="results"></div>

  <h3>Collaboration Requests Sent</h3>
  <ul id="requests"></ul>

  <script src="script.js"></script>
</body>
</html>
